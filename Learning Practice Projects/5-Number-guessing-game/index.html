<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-box">
      <div>
        <h1>Number Guessing Game</h1>
        <p>Try to guess number between 1 to 20</p>
        <p>You have 10 chances to guess the right number</p>
      </div>

      <div class="info">
        <h3 id="guessRemaining">Guess Remaining : 10</h3>
        <h4 id="previousGuesses">Previous Guesses : [ ]</h4>
      </div>

      <form id="form">
        <label for="userInput">Enter your guess number</label>
        <input type="number" id="userInput" min="1" max="20" />
        <button type="submit" id="checkButton">Check</button>
      </form>

      <div class="result-box">
        <h3 id="result">Result :</h3>
      </div>
    </div>

    <script src="logic.js"></script>
  </body>
</html>
