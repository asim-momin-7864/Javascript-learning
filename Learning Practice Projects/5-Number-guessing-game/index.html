<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Number Guessing Game</title>
</head>
<body>

    <div>
    <h1>Number Guessing Game</h1>
    <p>Try to guess number between 1 to 20</p>
    <p>you have 10 chances to guess right number</p>
    </div>

    <div>
        <h3 id="guessRemaining">Guess Remaining : 10</h3>
        <h4 id="previousGuesses">Previous Guesses : [ ] </h4>
    </div>

    <form id="form" method="post">
      <h1><label for="userInput">Enter your guess number :</label></h1>
      <input type="number" id="userInput" min="1" max="20" >
      <button type="submit" id="checkButton" >Check</button>
    </form>

    <div>
     <h3 id="result">Result : Wrong ! </h3>
    </div>
    
    <script src="logic.js"></script>
</body>
</html>
