<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODOish</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f6f8;
        color: #333;

        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
        background-color: white;
        border: 1px solid #e1e4e8;
        border-radius: 8px;
      }

      h1 {
        text-align: center;
        color: #2c3e50;
        margin-top: 0;
      }

      hr {
        border: 0;
        border-top: 1px solid #eee;
        margin: 20px 0;
      }

      input[type="text"] {
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        width: 60%;
        font-size: 1rem;
      }

      button {
        padding: 8px 16px;
        cursor: pointer;
        border: 1px solid #d0d7de;
        background-color: #f6f8fa;
        border-radius: 6px;
        font-size: 0.9rem;
        transition: background-color 0.2s;
      }

      button:hover {
        background-color: #eef1f4;
      }

      button[type="submit"] {
        background-color: #2da44e;
        color: white;
        border: none;
        font-weight: 600;
      }
      button[type="submit"]:hover {
        background-color: #2c974b;
      }

      ul {
        padding: 0;
        list-style: none;
      }

      li {
        display: flex;
        align-items: center;
        gap: 10px;

        padding: 15px;
        border-bottom: 1px solid #eee;
      }

      li:last-child {
        border-bottom: none;
      }

      .p-task {
        flex-grow: 1;
        margin: 0;
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 1rem;
      }

      .checked {
        background-color: rgb(80, 204, 80);
        color: white;
        text-decoration: line-through;
      }

      li button {
        padding: 5px 10px;
        font-size: 0.8rem;
      }

      .delete-btn {
        color: #cf222e;
        border-color: #d5d8da;
      }
      .check-btn {
        color: #0969da;
        border-color: #d5d8da;
      }
    </style>
  </head>
  <body>
    <h1>TODOish</h1>
    <hr />

    <div style="display: flex; gap: 10px; justify-content: center">
      <button type="button" id="reload">Reload</button>
      <button type="button" id="save">Save</button>
    </div>

    <hr />

    <form id="form" style="text-align: center">
      <label
        for="taskInput"
        style="font-weight: bold; display: block; margin-bottom: 10px"
        >Enter Task Here:</label
      >
      <input
        type="text"
        name="taskInput"
        id="taskInput"
        placeholder="e.g. Buy groceries..."
      />
      <button type="submit">Add Task</button>
    </form>

    <hr />

    <ul id="allTasks">
  
    </ul>

    <script src="logic.js"></script>
  </body>
</html>
