<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <h1>Broswer - Events</h1>
    <ul id="photo-list">
      <li>
        <img
          id="test-paper"
          class="pictures"
          src="https://images.unsplash.com/photo-1606326608606-aa0b62935f2b?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="#"
        />
      </li>
      <li>
        <img
          id="flowers"
          class="pictures"
          src="https://images.unsplash.com/photo-1587471577460-bdb4891711ce?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="#"
        />
      </li>
      <li>
        <img
          id="car"
          class="pictures"
          src="https://images.unsplash.com/photo-1459603677915-a62079ffd002?q=80&w=1534&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="#"
        />
      </li>
      <li>
        <img
          id="fox"
          class="pictures"
          src="https://images.unsplash.com/photo-1474511320723-9a56873867b5?q=80&w=1172&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="#"
        />
      </li>
      <li>
        <img
          id="bird"
          class="pictures"
          src="https://images.unsplash.com/photo-1552728089-57bdde30beb3?q=80&w=725&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="#"
        />
      </li>

      <li>
        <a id="link-google" style="color: black" href="https://google.com/"
          >Google Link</a
        >
      </li>
    </ul>

    <script>
      // Activity: When we click on the images, the image with LI will be delete

      // lets apply event listener on UL

      document.getElementById("photo-list").addEventListener("click", (e) => {
        console.log(e.target.id); // attributes
        console.log("e.target.tagName : - ", e.target.tagName);
        console.log("e.target.parentNode.tagName : - ", e.target.parentNode);

        // we can check child also , IMG tag or LINK ==

        // #1 here we are checking parent element directly what we are deleting 
        if (e.target.parentNode.tagName == "LI") { 
          e.target.parentNode.remove(); // catch parent and remove it 
        };



    // #2 other over complex way
        let deletingElement = e.target.parentNode;
        deletingElement.parentNode.removeChild(deletingElement); // we have LI --> UL --> its child LI --> LI deleting
      });
    </script>
  </body>
</html>
