<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <h1>Broswer - Events</h1>
    <ul id="photo-list">
      <li>
        <img
          id="test-paper"
          class="pictures"
          src="https://images.unsplash.com/photo-1606326608606-aa0b62935f2b?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="#"
        />
      </li>
      <li>
        <img
          id="flowers"
          class="pictures"
          src="https://images.unsplash.com/photo-1587471577460-bdb4891711ce?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="#"
        />
      </li>
      <li>
        <img
          id="car"
          class="pictures"
          src="https://images.unsplash.com/photo-1459603677915-a62079ffd002?q=80&w=1534&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="#"
        />
      </li>
      <li>
        <img
          id="fox"
          class="pictures"
          src="https://images.unsplash.com/photo-1474511320723-9a56873867b5?q=80&w=1172&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="#"
        />
      </li>
      <li>
        <img
          id="bird"
          onclick="alert('Bird is Parrot - by 1st Approch')"
          class="pictures"
          src="https://images.unsplash.com/photo-1552728089-57bdde30beb3?q=80&w=725&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="#"
        />
      </li>

      <!--* #1st Approch to apply events -->
      <!--* onclick="alert('Bird is Parrot')" -->
      <!--! in vanilla JS html dont use this approch , adding events directly on elements , this is not good for scalability -->
      <!-- In React the case is different, there we use this kind similiar syntax -->

      <li>
        <a id="link-google" style="color: black" href="https://google.com/"
          >Google Link</a
        >
      </li>
    </ul>
    
    <script>
      // #2nd approch to apply events
      // Not to use this approch because - this approch dont give more detailed information about event, if maybe some issue in onClick you never now
      // this approch gives you less features compare to addEventListners ... for e.g like propagation
      document.getElementById("bird").onclick = function () {
        alert("Bird is Parrot - by 2nd Approch");
      };

      // #3rd approch to apply events - RECOMMENDED
      // 3rd paramatere (propagation direction) - by default value is false

      document.getElementById("fox").addEventListener(
        "click",
        (e) => {
          console.log(e); // => lots of events and properties
        },
        false,
      );

      /*
        LEARN AND EXPLORE ABOUT IT

        Browser Events
        Environment Events

        What to Explore in Events
        1) types - mouse, keyboard, ...
        2) timestamp
        3) preventDefault()
        4) target
        5) toElement
        6) srcElement
        7) currentTarget
        8) clientX, clientY, screenX, screenY
        9) altkey, ctrlkey,shiftkey, special keys ...
        - PROJECT : keyboard typing speed, write wrong typing mini app
        - PROJECT : when click on window a circle will appear there 

*/

      /*
         #3rd Parameter - Propagation Direction (track elements / apply that evenet effects)
         - false -> Bubbling Up (Event Propagate from lower level to higher level elements )
         - true -> Event Capturing Mode (Event Propagate from higher level to lower level elements )

*/

      // EXAMPLE #1 - false (Bubbling Up)

      // TASK is we are applying event on UL and again another event on "flowers" LI
      // so if we click on any other LI first UL event will fire
      // but if we click on "flowers" LI then which event should be execute first ?  which direction lower element first or higher element first
      // in this kind cases we need to define Execution Propagation direction by 3rd parameter

      document.getElementById("photo-list").addEventListener(
        "click",
        (e) => {
          console.log("click on UL : Higher element");
        },
        false,
      );

      document.getElementById("flowers").addEventListener(
        "click",
        (e) => {
          console.log("click on LI : Lower element");

          // Stop Propagation
          e.stopPropagation(); //(only this event will execute) => index.html:125 click on LI : Lower element
        },
        false,
      );

      // by false - lower element will fire first / execute and execution propagation go to higher element
      /* o/p => 

index.html:125 click on LI : Lower element
index.html:121 click on UL : Higher element

*/

      // EXAMPLE #2 - true (Capture Mode)

      document.getElementById("photo-list").addEventListener(
        "click",
        (e) => {
          console.log("click on UL : Higher element");
        },
        true,
      );

      document.getElementById("flowers").addEventListener(
        "click",
        (e) => {
          console.log("click on LI : Lower element");
        },
        true,
      );

      // by true - higher element will fire first / execute and execution propagation go to lower element

      /* o/p => 

index.html:139 click on UL : Higher element
index.html:143 click on LI : Lower element

*/

      // EXAMPLE #3

      // preventDefault()

      document
        .getElementById("link-google")
        .addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          console.log("Link is Clickend but we prevent its behaviour");
        });

      // ---------------------------------------------------------------
      // Other Old Approches
      // attachEvent() - use in internet Explorer
      // jQuery - onEventListner()
    </script>
  </body>
</html>
