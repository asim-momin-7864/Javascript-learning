<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Base Reset & Typography */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 40px;
            font-weight: 600;
        }

        /* Container for the Cards */
        #users-ul {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0;
            list-style: none;
        }

        /* Individual User Card */
        .users-li {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        /* Styling the Paragraphs inside the card */
        .users-li p {
            margin: 5px 0;
            font-size: 0.9rem;
        }

        /* Specific Data Styling */
        .id { 
            font-weight: bold; 
            color: #888; 
            font-size: 0.8rem !important;
        }
        .name { 
            font-size: 1.1rem !important; 
            font-weight: 600; 
            color: #007bff; 
            margin-bottom: 10px !important;
        }
        .email, .website { 
            color: #555;
            text-decoration: underline;
            text-underline-offset: 2px;
            font-style: italic;
        }
        .company-name {
            margin-top: 10px !important;
            padding-top: 10px;
            border-top: 1px dashed #eee;
            font-weight: 500;
            color: #444;
        }
    </style>
</head>
<body>
    <h1>Users</h1>
    <ul id="users-ul" >

    </ul>
    
    <script src="./logic.js"></script>
</body>
</html>
